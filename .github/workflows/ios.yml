# Builds the iOS app and uploads the .ipa as a workflow artifact.
#
# Without signing secrets it produces an unsigned .ipa, which you can sideload
# with a tool that re-signs it (Sideloadly, AltStore) or sign yourself.
# To get an installable signed .ipa, add these repository secrets:
#   IOS_CERTIFICATE_P12_BASE64   base64 of your signing certificate (.p12)
#   IOS_CERTIFICATE_PASSWORD     its password
#   IOS_PROVISIONING_PROFILE_BASE64  base64 of a .mobileprovision for net.techfren.bbvoice
#   IOS_TEAM_ID                  your Apple Developer team id
name: iOS

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      export_method:
        description: Export method when signing secrets are set
        type: choice
        default: release-testing
        options: [release-testing, debugging, app-store-connect, enterprise]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      SCHEME: bbvoice
      HAS_SIGNING: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Show Xcode
        run: xcodebuild -version

      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json', 'modules/**/*.podspec') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean
        env:
          CI: 1

      - name: Import signing certificate and profile
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ "$HAS_SIGNING" = "true" ]; then
            SIGNING=(CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" CODE_SIGN_IDENTITY="Apple Distribution")
            [ "${{ inputs.export_method }}" = "debugging" ] && SIGNING+=(CODE_SIGN_IDENTITY="Apple Development")
          else
            SIGNING=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="")
          fi
          set -o pipefail
          xcodebuild archive \
            -workspace "ios/$SCHEME.xcworkspace" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            "${SIGNING[@]}" | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E '^(\*\*|error|.*: error:|.*warning: .*BbVoiceNative)' || true
          test -d "$RUNNER_TEMP/$SCHEME.xcarchive/Products/Applications/$SCHEME.app"

      - name: Package .ipa
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          METHOD: ${{ inputs.export_method || 'release-testing' }}
        run: |
          mkdir -p dist
          if [ "$HAS_SIGNING" = "true" ]; then
            cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>net.techfren.bbvoice</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -exportPath "$RUNNER_TEMP/export"
            mv "$RUNNER_TEMP"/export/*.ipa dist/bb-voice.ipa
          else
            mkdir -p "$RUNNER_TEMP/ipa/Payload"
            cp -R "$RUNNER_TEMP/$SCHEME.xcarchive/Products/Applications/$SCHEME.app" "$RUNNER_TEMP/ipa/Payload/"
            (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/dist/bb-voice-unsigned.ipa" Payload)
          fi
          ls -lh dist

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log

      - uses: actions/upload-artifact@v4
        with:
          name: bb-voice-ios
          path: dist/*.ipa
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipa

      - name: Remove signing keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
